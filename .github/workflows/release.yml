name: tests and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Official Python images: 3.9 is what a Mac ships with, 3.12 is current.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["python:3.9-slim", "python:3.12-slim"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --root-user-action=ignore -q -e ".[dev]"
      - run: python -m pytest -q

  ui:
    # The page in a real browser (Chromium): every script loads, tabs and dialogs open without errors.
    runs-on: ubuntu-latest
    container: python:3.12
    steps:
      - uses: actions/checkout@v4
      - run: pip install --root-user-action=ignore -q -e ".[dev]" playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_ui_smoke.py

  release:
    # A tag v1.2.3 publishes the installer for that version; the app updates itself from here.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag must match the version in the code
        # v0.3.0 is a release, v0.3.0-beta.1 / -rc.1 a prerelease; pyproject holds the same in PEP 440 (0.3.0b1).
        run: |
          pip install -q packaging
          python3 - <<'PY'
          import os, re
          from packaging.version import Version
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          code = re.search(r'^__version__ = "([^"]+)"', open("src/xui_fleet/__init__.py").read(), re.M).group(1)
          proj = re.search(r'^version = "([^"]+)"', open("pyproject.toml").read(), re.M).group(1)
          print(f"tag={tag} code={code} pyproject={proj}")
          assert tag == code, "версия в коде не совпадает с тегом"
          assert Version(tag) == Version(proj), "версия в pyproject.toml не совпадает с тегом"
          PY
      - name: Build the installer archive
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir -p dist/xui-fleet
          cp -r launcher.py pyproject.toml README.md fleet.example.yaml scripts src "Запустить xui-fleet.bat" "Запустить xui-fleet.command" "Запустить xui-fleet.sh" dist/xui-fleet/
          find dist -name __pycache__ -prune -exec rm -rf {} +
          chmod +x "dist/xui-fleet/Запустить xui-fleet.command" "dist/xui-fleet/Запустить xui-fleet.sh" dist/xui-fleet/scripts/start-unix.sh
          (cd dist && zip -qr "xui-fleet-$v.zip" xui-fleet && sha256sum "xui-fleet-$v.zip" > "xui-fleet-$v.zip.sha256")
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          pre=""
          case "$v" in *-*) pre="--prerelease" ;; esac
          # The notes are the commit messages since the previous version: there are no pull requests here,
          # so --generate-notes would leave nothing but a "Full Changelog" link.
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > notes.md
          gh release create "$GITHUB_REF_NAME" "dist/xui-fleet-$v.zip" "dist/xui-fleet-$v.zip.sha256" \
            --title "xui-fleet $v" $pre --notes-file notes.md
      - name: Fill in the notes of earlier releases that have none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            if ! gh release view "$tag" --json body --jq .body | grep -q '^## Что нового'; then
              python3 scripts/release_notes.py "$tag" "$GITHUB_REPOSITORY" > "notes-$tag.md"
              gh release edit "$tag" --notes-file "notes-$tag.md" && echo "notes added: $tag"
            fi
          done
