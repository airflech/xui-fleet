<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4d7c0f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <g id="people">
      <circle cx="-11" cy="-8" r="6" fill="#64748b"/><path d="M-22,10 a11,10 0 0 1 22,0 z" fill="#64748b"/>
      <circle cx="11" cy="-8" r="6" fill="#64748b"/><path d="M0,10 a11,10 0 0 1 22,0 z" fill="#64748b"/>
      <circle cx="0" cy="-4" r="7.5" fill="#1e293b"/><path d="M-13,16 a13,12 0 0 1 26,0 z" fill="#1e293b"/>
    </g>
  </defs>
  <rect width="960" height="520" rx="14" fill="#ffffff"/>

  <!-- admin computer -->
  <rect x="300" y="20" width="350" height="62" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="318" y="37" width="26" height="18" rx="2" fill="none" stroke="#334155" stroke-width="2"/><path d="M313,60 h36" stroke="#334155" stroke-width="2.5"/>
  <text x="500" y="46" text-anchor="middle" font-weight="600" fill="#0f172a">xui-fleet на вашем компьютере</text>
  <text x="500" y="68" text-anchor="middle" fill="#475569" font-size="13">настраивает все серверы по SSH и API 3x-ui</text>
  <path d="M400,84 C380,120 340,150 318,186" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#g)"/>
  <path d="M570,84 C600,110 640,125 668,146" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#g)"/>
  <text x="618" y="104" fill="#64748b" font-size="13">управление</text>

  <!-- users -->
  <circle cx="80" cy="256" r="40" fill="#ecfccb" stroke="#4d7c0f" stroke-width="1.5"/>
  <use href="#people" x="80" y="256"/>
  <text x="80" y="318" text-anchor="middle" font-weight="600" fill="#0f172a">Пользователи</text>
  <text x="80" y="338" text-anchor="middle" fill="#475569" font-size="13">Happ или INCY</text>

  <!-- master -->
  <rect x="200" y="190" width="230" height="132" rx="12" fill="#f7fee7" stroke="#4d7c0f" stroke-width="2"/>
  <text x="315" y="220" text-anchor="middle" font-weight="700" fill="#0f172a" font-size="17">Главный сервер</text>
  <text x="315" y="244" text-anchor="middle" fill="#475569" font-size="13">панель 3x-ui и подписки,</text>
  <text x="315" y="263" text-anchor="middle" fill="#475569" font-size="13">входы «через главный»</text>
  <text x="315" y="282" text-anchor="middle" fill="#475569" font-size="13">(обычно в вашей стране)</text>
  <text x="315" y="308" text-anchor="middle" fill="#4d7c0f" font-size="13" font-weight="600">sub.example.com</text>

  <!-- foreign servers -->
  <rect x="560" y="150" width="200" height="74" rx="12" fill="#ffffff" stroke="#4d7c0f" stroke-width="2"/>
  <text x="660" y="182" text-anchor="middle" font-weight="700" fill="#0f172a" font-size="16">Зарубежный сервер 1</text>
  <text x="660" y="205" text-anchor="middle" fill="#475569" font-size="13">например, Великобритания</text>
  <rect x="560" y="290" width="200" height="74" rx="12" fill="#ffffff" stroke="#4d7c0f" stroke-width="2"/>
  <text x="660" y="322" text-anchor="middle" font-weight="700" fill="#0f172a" font-size="16">Зарубежный сервер 2</text>
  <text x="660" y="345" text-anchor="middle" fill="#475569" font-size="13">например, Германия</text>

  <!-- internet -->
  <g transform="translate(880,196)" fill="none" stroke="#4d7c0f" stroke-width="1.8">
    <circle r="30" fill="#f0fdf4"/><ellipse rx="13" ry="30"/><path d="M-30,0 h60 M-26,-14 h52 M-26,14 h52"/>
  </g>
  <text x="880" y="250" text-anchor="middle" font-weight="600" fill="#0f172a">Интернет</text>
  <!-- warp -->
  <path d="M842,366 a20,20 0 0 1 4,-38 a28,28 0 0 1 52,-6 a20,20 0 0 1 22,44 z" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="880" y="392" text-anchor="middle" font-weight="600" fill="#9a3412" font-size="14">Cloudflare WARP</text>
  <text x="880" y="430" text-anchor="middle" fill="#9a3412" font-size="13">дальше в интернет</text>
  <text x="880" y="447" text-anchor="middle" fill="#9a3412" font-size="13">с адреса Cloudflare</text>

  <!-- via master (green) -->
  <path d="M122,256 L196,256" fill="none" stroke="#4d7c0f" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#a)"/>
  <path d="M432,236 C490,220 510,195 556,190" fill="none" stroke="#4d7c0f" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#a)"/>
  <path d="M432,276 C490,292 510,320 556,325" fill="none" stroke="#4d7c0f" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#a)"/>
  <path d="M762,186 L846,192" fill="none" stroke="#4d7c0f" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#a)"/>
  <path d="M762,312 C800,296 830,260 856,220" fill="none" stroke="#4d7c0f" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#a)"/>

  <!-- direct (blue) -->
  <path d="M96,219 C140,110 420,110 556,166" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#b)"/>
  <path d="M118,276 C200,470 440,460 556,350" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#b)"/>
  
  <text x="150" y="128" fill="#2563eb" font-size="13" font-weight="600">напрямую, без главного</text>

  <!-- warp (orange) -->
  <path d="M762,214 C805,240 825,290 840,322" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#o)"/>
  <path d="M762,342 L836,346" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#o)"/>
  <path d="M880,400 L880,414" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="2 4"/>

  <!-- legend -->
  <g font-size="13" fill="#334155">
    <line x1="40" y1="492" x2="80" y2="492" stroke="#4d7c0f" stroke-width="3" stroke-dasharray="9 6"/><text x="88" y="497">через главный сервер</text>
    <line x1="260" y1="492" x2="300" y2="492" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 6"/><text x="308" y="497">напрямую к зарубежному</text>
    <line x1="500" y1="492" x2="540" y2="492" stroke="#ea580c" stroke-width="2" stroke-dasharray="2 5"/><text x="548" y="497">выход через WARP</text>
    <line x1="700" y1="492" x2="740" y2="492" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4"/><text x="748" y="497">управление</text>
  </g>
</svg>
