  <text x="485" y="68" text-anchor="middle" font-weight="700" fill="#7f1d1d" font-size="15">sub.example.com</text>
  <text x="485" y="90" text-anchor="middle" fill="#991b1b" font-size="13">основной домен — заблокирован</text>
  <rect x="370" y="196" width="230" height="64" rx="12" fill="#f7fee7" stroke="#4d7c0f" stroke-width="2"/>
  <text x="485" y="224" text-anchor="middle" font-weight="700" fill="#0f172a" font-size="15">reserve.example.com</text>
