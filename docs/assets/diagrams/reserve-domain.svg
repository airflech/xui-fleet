    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="960" height="300" rx="14" fill="#ffffff"/>
  <rect x="40" y="110" width="170" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="125" y="144" text-anchor="middle" font-weight="700" fill="#0f172a" font-size="15">Happ / INCY</text>
  <text x="125" y="166" text-anchor="middle" fill="#475569" font-size="13">обновляет подписку</text>

