[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xui-fleet"
version = "0.2.6"
description = "Автоматизация 3x-ui: главная панель, ноды и каскад RU -> зарубежные серверы"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "PyYAML>=6",
    "httpx>=0.27",
    "paramiko>=3.4",
    "cryptography>=41",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xui-fleet = "xui_fleet.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xui_fleet = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs live 3x-ui panels (XFLEET_IT_* env)", "warp: test exercises WARP entries"]
